<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Email Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to bottom, white, #eef2fc);
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: #ffffff;
            padding: 20px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header img {
            height: 50px;
            margin-right: 20px;
        }

        header a {
            margin-left: 10px;
            margin-right: 30px;
            color: rgb(100, 100, 100);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
        }

        .dropdown-button {
            background-color: #f0f4f8;
            color: rgb(179, 176, 176);
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: rgb(179, 176, 176);
            padding: 10px 20px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f0f4f8;
        }

        .menu-btn {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            background: #123a92;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1001;
        }

        .menu-btn:hover {
            background-color: #0e2a7b;
            transform: translateY(-50%) scale(1.05);
        }

        .sidebar {
            width: 200px;
            background: #f9f9f9;
            padding: 20px;
            position: fixed;
            left: -220px;
            top: 80px;
            height: calc(100vh - 80px);
            transition: 0.3s ease;
            box-shadow: 2px 0px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 10px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
            margin-top: 5px;
            border-radius: 5px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #e0e7ff;
            color: #123a92;
            font-weight: bold;
        }

        .main-content {
            margin-left: 20px;
            padding: 40px;
            flex-grow: 1;
            transition: 0.3s;
        }

        .main-content.shifted {
            margin-left: 220px;
        }

        .input-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .input-box {
            flex: 1;
            height: 150px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background: #f5f5f5;
            color: #666;
            font-size: 14px;
        }

        .scan-btn {
            display: block;
            margin: 30px auto;
            background-color: #123a92;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .scan-btn:hover {
            background-color: #0e2a7b;
        }

        .result-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .result-box {
            flex: 1;
            min-height: 100px;
            padding: 15px;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
        }

        .result-box.Malicious {
            border-color: red;
            color: red;
        }

        .result-box.Safe {
            border-color: green;
            color: green;
        }

        .action-buttons {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .reset-btn,
        .move-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .reset-btn {
            background: #123a92;
            color: white;
        }

        .move-btn {
            background: #ffbb33;
            color: black;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #123a92;
            color: white;
            padding: 20px 40px;
            margin-top: auto;
        }

        .footer-text {
            font-size: 12px;
        }
    </style>
</head>
<body>
<header>
    <button class="menu-btn" onclick="toggleSidebar()" id="menuIcon">≡</button>
    <img src="/static/logo.jpg" alt="Logo">
    <a href="#" onclick="location.href='/about'">About Us</a>
    <nav>
        <div class="dropdown">
            <div class="dropdown-button">
                <span class="language-text" data-en="Eng" data-ar="العربية">Eng</span> <span>&#9662;</span>
            </div>
            <div class="dropdown-content">
                <a href="#" onclick="setLanguage('en')">English</a>
                <a href="#" onclick="setLanguage('ar')">العربية</a>
            </div>
        </div>
    </nav>
</header>

<div class="sidebar" id="sidebar">
    <a href="/">🏠 Home</a>
    <a href="/check" class="active">📩 Quick Email Check</a>
    <a href="/junk">📂 Junk</a>
    <h4>OTHERS</h4>
    <a onclick="location.href='/help'">❓ Help</a>
</div>

<div class="main-content" id="main-content">
    <h1>Quick Email Check</h1>
    <div class="input-container">
        <textarea class="input-box" id="emailText" placeholder="Copy and paste email title and message here then press 'Scan'"></textarea>
    </div>
    <div class="result-container">
        <div id="final-result-box" class="result-box">The result will appear here.</div>
    </div>
    <div id="action-buttons" class="action-buttons">
        <button class="reset-btn" onclick="resetPage()">Reset</button>
        <button class="move-btn" onclick="moveToJunk()">Move to Junk</button>
    </div>
    <button class="scan-btn" onclick="checkEmail()">Scan</button>
</div>

<div class="footer">
    <span class="footer-text">2025 Mail Pawns. All rights reserved.</span>
</div>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuIcon");

    if (sidebar.classList.contains("open")) {
        sidebar.classList.remove("open");
        menuBtn.innerText = "≡";
        menuBtn.style.left = "15px";
    } else {
        sidebar.classList.add("open");
        menuBtn.innerText = "×";
        menuBtn.style.left = "200px";
    }
}

function checkEmail() {
    const emailText = document.getElementById('emailText').value;
    if (!emailText.trim()) {
        alert("Please enter email text to analyze");
        return;
    }

    const finalResultBox = document.getElementById('final-result-box');
    finalResultBox.innerText = "Analyzing...";
    finalResultBox.className = "result-box";

    fetch('/predict', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ text: emailText }),
    })
    .then(response => response.json())
    .then(data => {
        const textResult = data["Text result"];
        const urlResult = data["URL result"];

        let finalResult;
        if (textResult === "Malicious" || urlResult === "Malicious") {
            finalResult = "Malicious";
            finalResultBox.className = "result-box Malicious";
        } else {
            finalResult = "Not Malicious";
            finalResultBox.className = "result-box Safe";
        }

        finalResultBox.innerText = `Result: ${finalResult}`;
        document.getElementById('action-buttons').style.display = 'flex';
    })
    .catch((error) => {
        console.error('Error:', error);
        finalResultBox.innerText = "An error occurred during analysis.";
        finalResultBox.className = "result-box";
        document.getElementById('action-buttons').style.display = 'none';
    });
}

function resetPage() {
    document.getElementById('emailText').value = '';
    document.getElementById('final-result-box').innerText = 'The result will appear here.';
    document.getElementById('final-result-box').className = 'result-box';
    document.getElementById('action-buttons').style.display = 'none';
}

function moveToJunk() {
    const emailText = document.getElementById('emailText').value;
    if (!emailText.trim()) {
        alert("No email content to move to junk");
        return;
    }

    fetch('/predict', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ text: emailText, save_to_junk: true }),
    })
    .then(response => response.json())
    .then(data => {
        alert("Email moved to junk successfully!");
        resetPage();
    })
    .catch((error) => {
        console.error('Error:', error);
        alert("Error moving email to junk");
    });
}

async function setLanguage(lang) {
    try {
        const response = await fetch('/set_language', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ lang: lang })
        });

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Error changing language');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error changing language');
    }
}
</script>
</body>
</html>
